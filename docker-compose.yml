version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: teda-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teda
    ports:
      - "5432:5432"
    volumes:
      - teda_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: teda-backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: teda-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  teda_pgdata:
